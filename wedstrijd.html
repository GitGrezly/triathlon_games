'use strict';
/* WILLEM II VOETBAL - 4 tegen 4 met lopen, overspelen en schieten. Intern 320x180, zelfde stijl als Triathlon Games. */
const W = 320, H = 180;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;

// ---------- tekenhulp
const rect = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const px = (x, y, c) => rect(x, y, 1, 1, c);
function line(x0, y0, x1, y1, c) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) px(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, c);
}
function thick(x0, y0, x1, y1, w, c) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) rect(x0 + (x1 - x0) * i / n - w / 2 + 0.5, y0 + (y1 - y0) * i / n - w / 2 + 0.5, w, w, c);
}
function circ(cx, cy, r, c) {
  for (let dy = -r; dy <= r; dy++) { const hw = Math.round(Math.sqrt(r * r - dy * dy)); rect(cx - hw, cy + dy, hw * 2 + 1, 1, c); }
}
function ik(hx, hy, fx, fy, l1, l2, s) {           // twee-botten-ledemaat (knie/elleboog)
  let dx = fx - hx, dy = fy - hy, d = Math.hypot(dx, dy) || 0.001; const m = l1 + l2 - 0.05;
  if (d > m) { fx = hx + dx * m / d; fy = hy + dy * m / d; dx = fx - hx; dy = fy - hy; d = m; }
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  return [hx + dx * a / d + s * dy / d * h, hy + dy * a / d - s * dx / d * h, fx, fy];
}
const rnd = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const GRAD = ['#d82800', '#f83800', '#fc7c30', '#fcb830', '#fcf050'];
const RED = '#d8201c', WHITE = '#fcfcfc', BLUE = '#1c3ca8', YEL = '#f8d800';

// ---------- 3x5 pixelfont (M, N, W en K zijn breder)
const FONT = {};
('A:010101111101101|B:110101110101110|C:011100100100011|D:110101101101110|E:111100110100111|F:111100110100100|' +
 'G:011100101101011|H:101101111101101|I:111010010010111|J:001001001101010|K:101101110101101|L:100100100100111|' +
 'M:101111111101101|N:110101101101101|O:010101101101010|P:110101110100100|Q:010101101111011|R:110101110101101|' +
 'S:011100010001110|T:111010010010010|U:101101101101111|V:101101101101010|W:101101111111101|X:101101010101101|' +
 'Y:101101010010010|Z:111001010100111|0:111101101101111|1:010110010010111|2:110001010100111|3:110001010001110|' +
 '4:101101111001001|5:111100110001110|6:011100111101111|7:111001010010010|8:111101111101111|9:111101111001110|' +
 '!:010010010000010|.:000000000000010|::000010000010000|-:000000111000000|+:000010111010000|/:001001010100100|' +
 '?:110001010000010|\':010010000000000|%:101001010100101|,:000000000010100|=:000111000111000|>:100010001010100|' +
 '<:001010100010001|&:010101010101011')
  .split('|').forEach(p => { FONT[p[0]] = p.slice(2); });
FONT.M = '1000111011101011000110001'; FONT.W = '1000110001101011101110001';
FONT.N = '10011101101110011001'; FONT.K = '10011010110010101001';
function text(s, x, y, c, sc = 1, rows) {
  for (const ch of String(s).toUpperCase()) {
    const gl = FONT[ch];
    if (!gl) { x += 4 * sc; continue; }
    const w = gl.length / 5;
    for (let k = 0; k < gl.length; k++) if (gl[k] === '1') rect(x + (k % w) * sc, y + ((k / w) | 0) * sc, sc, sc, rows ? rows[(k / w) | 0] : c);

const tw = (s, sc = 1) => { let n = -1; for (const ch of String(s).toUpperCase()) n += (FONT[ch] ? FONT[ch].length / 5 : 3) + 1; return n * sc; };

  const t = sc > 3 ? 2 : 1;
  for (const [dx, dy] of [[-t, 0], [t, 0], [0, -t], [0, t], [-t, -t], [t, -t], [-t, t], [t, t]]) text(s, x + dx, y + dy, '#000', sc);
  if (sc > t) text(s, x + sc, y + sc, '#000', sc);

};
const ctext = (s, y, c, sc = 1, rows) => stext(s, Math.round((W - tw(s, sc)) / 2), y, c, sc, rows);

// ---------- geluid (WebAudio, geen bestanden nodig)

function tone(freq, dur, type = 'square', vol = 0.05, when = 0, slide = 0) {
  if (!soundOn) return;

  const t = a.currentTime + when, o = a.createOscillator(), v = a.createGain();

// ---------- poppetjes (zelfde als in Triathlon Games, nu met eigen shirtkleuren)
const SKIN = '#fcc89c', SKIN_D = '#d89870';
function face(hx, hy, mood, girl) {
  rect(hx - 4, hy - 19, 8, 8, SKIN); rect(hx - 4, hy - 19, 1, 8, SKIN_D); rect(hx - 3, hy - 16, 2, 2, SKIN_D);

  if (mood) rect(hx + 1, hy - 13, 3, 2, '#802020'); else rect(hx + 1, hy - 13, 3, 1, girl ? '#d84060' : '#a04030');

function runner(sx, y, a) {                         // a: bands (9 shirtrijen), col (mouwen), shorts, sock, shoe, glove, hair, ph, stand, cheer
  const stand = !!a.stand, amp = stand ? 0.12 : 1, u0 = stand ? 0 : a.ph * 1.6 * Math.PI;

    rect(f[2] - 2, f[3] - 1, 5, 2, a.shoe || '#fcfcfc'); rect(f[2] - 2, f[3] + 1, 5, 1, '#101018'); px(f[2] + 2, f[3] - 1, a.shoe || '#fcfcfc');
  };

    thick(sh[0], sh[1], e[0], e[1], 2, c); thick(e[0], e[1], e[2], e[3], 2, c);

    if (a.glove) rect(e[2] - 1, e[3] - 1, 4, 4, a.glove); else { rect(e[2] - 1, e[3] - 1, 3, 1, k ? '#fcfcfc' : '#303040'); rect(e[2], e[3], 2, 2, c); }
  };
  leg(1); arm(1);
  a.bands.forEach((c, r) => rect(hx - 3, hy - 9 + r, 6, 1, c));

const OUT = { oc: null, sc: null, tc: null, hc: null, W: 64, H: 64, OX: 32, OY: 46 };

// ---------- veld en stadion
const L = 720, TOP = 96, BOT = 176, GY0 = 124, GY1 = 148, GC = 136;   // veldlengte, zijlijnen, doelmond
let cam = 0;
const TILE = 336, CROWD = [null, null];
function buildCrowd() {

    const c = document.createElement('canvas'); c.width = TILE; c.height = 110; const q = c.getContext('2d');
    for (let row = 0; row < 8; row++) for (let col = 0; col < 56; col++) {

      const shirt = [RED, WHITE, BLUE, RED, BLUE, WHITE, RED, YEL][(rnd(i) * 8) | 0], hair = ['#503000', '#201010', '#a05820', '#e8c050'][(rnd(i + 5) * 4) | 0], sk = rnd(i + 3) > 0.7 ? SKIN_D : SKIN;
      for (const xx of [x, x + TILE]) {
