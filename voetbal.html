const ROUNDS = 5;
let PROFILE = { name: 'SPELER', girl: false };
try {
  const s = JSON.parse(localStorage.getItem('triathlonProfile') || 'null');
  if (s && typeof s.name === 'string' && s.name) PROFILE = { name: s.name.toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 9) || 'SPELER', girl: !!s.girl };
} catch (e) { /* geen opslag */ }
try { best = +localStorage.getItem('willem2Best') || 0; } catch (e) { /* geen opslag */ }
const me = () => ({ hair: PROFILE.girl ? '#a05820' : '#503000', girl: PROFILE.girl });

function startGame() { round = 0; goals = 0; results = []; confetti = []; newRound(); }
function newRound() {
  mode = 'aim'; msg = null; cheerT = 0;
  A = { phase: 0, x: 160, y: 80, dx: Math.random() < 0.5 ? 1 : -1, dy: 1 };
  K = { u: 0, kx: 160, ky: 91, ang: 0, go: false };
  S = null; ball = { x: BX, y: BY, r: 4, vx: 0, vy: 0, phys: false };
  PL = { x: 40, run: false, t: 0 };
}
function press() {
  if (mode === 'title') { sfx.beep(); startGame(); return; }
  if (mode === 'end') { if (endT > 1.2) { sfx.beep(); startGame(); } return; }
  if (mode !== 'aim') return;
  sfx.lock();
  if (A.phase === 0) { A.phase = 1; return; }
  shoot();
}
function shoot() {
  const tx = A.x, ty = A.y, R = 20 + 2 * round;
  let kind;
  if (tx < GOAL.x0 - 4 || tx > GOAL.x1 + 4) kind = 'wide';
  else if (ty < GOAL.y0 - 4) kind = 'over';
  else if (Math.abs(tx - GOAL.x0) <= 4 || Math.abs(tx - GOAL.x1) <= 4 || Math.abs(ty - GOAL.y0) <= 3) kind = 'post';
  else kind = 'goal';
  const kx = Math.random() < 0.25 ? 160 + (Math.random() - 0.5) * 16 : 104 + Math.random() * 112, ky = 66 + Math.random() * 30;
  if (kind === 'goal' && Math.hypot(tx - kx, ty - ky) < R) kind = 'save';
  S = { tx, ty, kind, t: 0, struck: false, arc: 6 + Math.max(0, (GOAL.y1 - ty) * 0.22) };
  K.kx = kx; K.ky = ky; K.ang = Math.sign(kx - 160) * Math.min(1.35, Math.abs(kx - 160) / 60 * 1.35);
  mode = 'kick'; PL.run = true; PL.t = 0;
}
const FLY = 0.45, RUN = 0.6;
function ballPos(u) {                                 // u 0..1 = vlucht naar het doel; daarna vliegen missers door
  const uu = Math.min(u, 1);
  let x = BX + (S.tx - BX) * uu, y = BY + (S.ty - BY) * uu - Math.sin(Math.PI * uu) * S.arc;
  if (u > 1) { const e = u - 1; x += (S.tx - BX) * e * 0.5; y += (S.ty - BY) * e * 0.5; }
  return [x, y, u < 0.3 ? 4 : u < 0.75 ? 3 : 2];
}
function finishShot() {
  const k = S.kind; mode = 'result'; resT = 0;
  if (k === 'goal') { goals++; results.push('G'); cheerT = 2; sfx.goal(); msg = ['GOAL!', 'GRAD']; for (let i = 0; i < 60; i++) confetti.push({ x: Math.random() * W, y: -Math.random() * 60, vy: 40 + Math.random() * 60, c: [RED, WHITE, BLUE][i % 3] }); }
  else {
    results.push('X');
    if (k === 'save') { sfx.save(); msg = ['GEREDDEN!', '#3cbcfc']; ball.phys = true; ball.vx = (S.tx - K.kx) * 1.5 + (S.tx < 160 ? -25 : 25); ball.vy = -40; }
    else if (k === 'post') { sfx.post(); msg = ['PAAL!', '#fcd800']; ball.phys = true; ball.vx = S.tx < 160 ? -55 : 55; ball.vy = S.ty <= GOAL.y0 + 3 ? 40 : -50; }
    else { sfx.miss(); msg = [k === 'over' ? 'ER OVER!' : 'ERNAAST!', '#fc9830']; }
  }
}
function update(dt) {
  T += dt; cheerT = Math.max(0, cheerT - dt);
  confetti.forEach(c => { c.y += c.vy * dt; if (c.y > H) c.y = H + 50; }); confetti = confetti.filter(c => c.y <= H + 10);
  if (mode === 'aim') {
    const sp = 125 + 22 * round;
    if (A.phase === 0) { A.x += A.dx * sp * dt; if (A.x > 246) { A.x = 246; A.dx = -1; } if (A.x < 74) { A.x = 74; A.dx = 1; } }
    else { A.y += A.dy * (sp * 0.7) * dt; if (A.y > 116) { A.y = 116; A.dy = -1; } if (A.y < 38) { A.y = 38; A.dy = 1; } }
    K.sway = Math.sin(T * 4) * 1.5;
  } else if (mode === 'kick') {
    PL.t += dt;
    if (!S.struck && PL.t >= RUN) { S.struck = true; K.go = true; sfx.kick(); }
    if (S.struck) {
      S.t += dt; const u = S.t / FLY, lim = (S.kind === 'wide' || S.kind === 'over') ? 1.7 : 1;
      const [x, y, r] = ballPos(Math.min(u, lim)); ball.x = x; ball.y = y; ball.r = r;
      if (u >= lim) finishShot();
    } else if ((PL.t * 14 | 0) !== ((PL.t - dt) * 14 | 0)) sfx.step();
  } else if (mode === 'result') {
    resT += dt;
    if (ball.phys) { ball.x += ball.vx * dt; ball.y += ball.vy * dt; ball.vy += 220 * dt; if (ball.y > 126 && ball.vy > 0) { ball.y = 126; ball.vy *= -0.4; ball.vx *= 0.7; } }
    if (resT > 1.7) {
      round++;
      if (round >= ROUNDS) { mode = 'end'; endT = 0; if (goals > best) { best = goals; try { localStorage.setItem('willem2Best', best); } catch (e) { /* negeren */ } } if (goals >= 3) { sfx.fanfare(); cheerT = 3; for (let i = 0; i < 70; i++) confetti.push({ x: Math.random() * W, y: -Math.random() * 90, vy: 30 + Math.random() * 50, c: [RED, WHITE, BLUE][i % 3] }); } }
      else newRound();
    }
  } else if (mode === 'end') { endT += dt; }
  if (K) { const target = K.go ? 1 : 0; K.u += (target - K.u) * Math.min(1, dt * 9); }
}

// ---------- tekenen
function netAndGoal(front) {
  if (!front) {
    rect(GOAL.x0, GOAL.y0, GOAL.x1 - GOAL.x0, GOAL.y1 - GOAL.y0, 'rgba(8,8,30,0.5)');
    for (let x = GOAL.x0; x <= GOAL.x1; x += 7) rect(x, GOAL.y0, 1, GOAL.y1 - GOAL.y0, 'rgba(255,255,255,0.16)');
    for (let y = GOAL.y0; y <= GOAL.y1; y += 7) rect(GOAL.x0, y, GOAL.x1 - GOAL.x0, 1, 'rgba(255,255,255,0.16)');
  } else {
    const w = GOAL.x1 - GOAL.x0 + 6;
    rect(GOAL.x0 - 4, GOAL.y0 - 4, w + 2, 5, '#000'); rect(GOAL.x0 - 4, GOAL.y0 - 4, 5, GOAL.y1 - GOAL.y0 + 5, '#000'); rect(GOAL.x1 - 1, GOAL.y0 - 4, 5, GOAL.y1 - GOAL.y0 + 5, '#000');
    rect(GOAL.x0 - 3, GOAL.y0 - 3, w, 3, WHITE); rect(GOAL.x0 - 3, GOAL.y0 - 3, 3, GOAL.y1 - GOAL.y0 + 4, WHITE); rect(GOAL.x1, GOAL.y0 - 3, 3, GOAL.y1 - GOAL.y0 + 4, WHITE);
    rect(GOAL.x0 - 1, GOAL.y0 - 3, 1, GOAL.y1 - GOAL.y0 + 4, '#a8a8c0'); rect(GOAL.x1, GOAL.y0 - 3, 1, GOAL.y1 - GOAL.y0 + 4, '#a8a8c0');
  }
}
function drawBall(x, y, r) {
  x = Math.round(x); y = Math.round(y);
  circ(x, y + r + 1, r, 'rgba(0,0,0,0.0)');
  circ(x, y, r + 1, '#101018'); circ(x, y, r, '#fcfcfc');
  if (r >= 3) { px(x, y, '#202030'); px(x - 2, y - 1, '#202030'); px(x + 2, y - 1, '#202030'); px(x - 1, y + 2, '#202030'); px(x + 1, y + 2, '#202030'); rect(x + 1, y + 1, 2, 2, '#c0c0d0'); }
  else px(x, y, '#202030');
}
function cross(x, y) {
  for (let k = 0; k < 24; k++) { const t = k / 24 * Math.PI * 2; px(x + Math.cos(t) * 7.5, y + Math.sin(t) * 7.5, '#000'); px(x + Math.cos(t) * 6, y + Math.sin(t) * 6, '#fcd800'); }
  rect(x - 10, y, 6, 1, '#fcd800'); rect(x + 5, y, 6, 1, '#fcd800'); rect(x, y - 10, 1, 6, '#fcd800'); rect(x, y + 5, 1, 6, '#fcd800');
}
function drawHud() {
  rect(0, 0, W, 17, 'rgba(6,6,30,0.65)'); rect(0, 17, W, 1, 'rgba(6,6,30,0.3)');
  stext('WILLEM II', 4, 6, '#fcfcfc'); stext(String(goals), 48, 3, '#fcd800', 2);
  for (let i = 0; i < ROUNDS; i++) {
    const x = 118 + i * 17, r = results[i], cur = i === round && mode !== 'end';
    circ(x, 8, 5, '#000'); circ(x, 8, 4, r === 'G' ? '#00d800' : r === 'X' ? '#f83800' : cur && (T * 3 | 0) % 2 ? '#fcd800' : '#404058');
    if (r === 'G') { px(x - 1, 8, '#fff'); px(x, 9, '#fff'); px(x + 1, 7, '#fff'); px(x + 2, 6, '#fff'); }
    if (r === 'X') { px(x - 2, 6, '#fff'); px(x + 2, 10, '#fff'); px(x + 2, 6, '#fff'); px(x - 2, 10, '#fff'); px(x, 8, '#fff'); }
  }
  const rt = 'RONDE ' + Math.min(round + 1, ROUNDS) + '/' + ROUNDS; stext(rt, W - 4 - tw(rt), 6, '#fcfcfc');
}
function drawGame() {
  drawStadium(cheerT);
  netAndGoal(false);
  const u = K.u, dive = ease(u), cx = 160 + (K.kx - 160) * dive, cy = 91 + (K.ky - 91) * dive, ang = K.ang * dive;
  outlined((X, Y) => { g.save(); g.translate(cx, cy); g.rotate(ang); g.translate(-cx, -cy); keeperDraw(cx, cy + 20, dive * (K.ky < 82 ? 1 : 0.7), K.sway || 0); g.restore(); }, cx, cy + 20);
  if (mode === 'aim' || mode === 'title' || !S || !S.struck) drawBall(BX, BY, 4);
  else drawBall(ball.x, ball.y, ball.r);
  if (S && S.kind === 'goal' && mode === 'result') { for (let x = GOAL.x0; x <= GOAL.x1; x += 7) rect(x, GOAL.y0, 1, GOAL.y1 - GOAL.y0, 'rgba(255,255,255,0.3)'); for (let y = GOAL.y0; y <= GOAL.y1; y += 7) rect(GOAL.x0, y, GOAL.x1 - GOAL.x0, 1, 'rgba(255,255,255,0.3)'); }
  netAndGoal(true);
  const cheer = (mode === 'result' && S.kind === 'goal') || (mode === 'end' && goals >= 3);
  const hop = cheer ? Math.abs(Math.sin(T * 9)) * 6 : 0;
  let px0 = PL.x;
  if (mode === 'kick' || (mode === 'result' && PL.run)) px0 = 40 + 98 * Math.min(1, PL.t / RUN) * (2 - Math.min(1, PL.t / RUN));
  px0 = Math.min(px0, 138);
  const moving = mode === 'kick' && PL.t < RUN, a = Object.assign(me(), { ph: PL.t * 5, stand: !moving, cheer });
  outlined((X, Y) => { g.save(); g.translate(X, Y); g.scale(2, 2); runner(0, 0, a); g.restore(); }, px0, 177 - hop, '#ffe36a');
  if (mode === 'aim') {
    ctext(A.phase === 0 ? (isTouch ? 'TIK = KIES LINKS OF RECHTS' : 'DRUK = KIES LINKS OF RECHTS') : (isTouch ? 'TIK = KIES LAAG OF HOOG' : 'DRUK = KIES LAAG OF HOOG'), 22, '#fcd800');
    if (A.phase === 0) { for (let y = GOAL.y0; y < GOAL.y1; y += 4) rect(A.x, y, 1, 2, 'rgba(252,216,0,0.7)'); cross(A.x, 82); }
    else { for (let y = GOAL.y0; y < GOAL.y1; y += 4) rect(A.x, y, 1, 2, 'rgba(252,216,0,0.35)'); for (let x = 74; x < 246; x += 4) rect(x, A.y, 2, 1, 'rgba(252,216,0,0.7)'); cross(A.x, A.y); }
    stext(PROFILE.name, Math.round(px0 - tw(PROFILE.name) / 2), 111, '#fcd800');
  } else if (S && mode !== 'end') cross(S.tx, S.ty);
  confetti.forEach(c => rect(c.x, c.y, 2, 2, c.c));
  if (mode === 'result' && msg) { if (msg[1] === 'GRAD') ctext(msg[0], 24, '#fff', 4, GRAD); else ctext(msg[0], 26, msg[1], 3); }
  if (mode === 'result' && S.kind === 'goal' && (T * 4 | 0) % 2) ctext('WILLEM II! WILLEM II!', 46, '#fcfcfc');
  drawHud();
  if (mode === 'end') drawEnd();
}
function drawEnd() {
  confetti.forEach(c => rect(c.x, c.y, 2, 2, c.c));
  rect(60, 26, 200, 128, '#000'); rect(62, 28, 196, 124, '#fcfcfc'); rect(63, 29, 194, 122, '#101030');
  [RED, WHITE, BLUE].forEach((c, i) => rect(63, 29 + i * 2, 194, 2, c));
  ctext('EINDSTAND', 40, '#fff', 3, GRAD);
  ctext(goals + ' VAN DE ' + ROUNDS + ' GESCOORD', 66, '#fcfcfc', 1);
  ctext(['OEFEN NOG EEN KEER!', 'OEFEN NOG EEN KEER!', 'HET WAS SPANNEND!', 'LEKKER BEZIG!', 'SUPER GOED!', 'PERFECT! WILLEM II!'][goals], 80, goals >= 4 ? '#fcd800' : '#3cbcfc');
  for (let i = 0; i < ROUNDS; i++) { const x = 112 + i * 24; circ(x, 104, 8, '#000'); circ(x, 104, 7, results[i] === 'G' ? '#00d800' : '#f83800'); stext(results[i] === 'G' ? 'V' : 'X', x - 1, 101, '#fff'); }
  ctext('RECORD ' + best + ' VAN DE ' + ROUNDS, 124, '#fcd800');
  if (endT > 1.2 && (T * 2 | 0) % 2 === 0) ctext(isTouch ? 'TIK = NOG EEN KEER' : 'ENTER = NOG EEN KEER', 138, '#fcfcfc');
}
function drawTitle() {
  drawStadium(1);
  netAndGoal(false); netAndGoal(true);
  outlined((X, Y) => keeperDraw(X, Y, 0, Math.sin(T * 4) * 1.5), 160, 111);
  rect(0, 0, W, 90, 'rgba(6,6,30,0.35)');
  ctext('WILLEM II', 6, '#fff', 5, GRAD);
  ctext("PENALTY'S", 36, '#fff', 4, GRAD);
  drawBall(BX, BY, 4);
  const a = Object.assign(me(), { ph: 0, stand: true, cheer: true }), hop = Math.abs(Math.sin(T * 7)) * 5;
  outlined((X, Y) => { g.save(); g.translate(X, Y); g.scale(2, 2); runner(0, 0, a); g.restore(); }, 250, 177 - hop, '#ffe36a');
  stext(PROFILE.name, Math.round(250 - tw(PROFILE.name) / 2), 100, '#fcd800');
  ctext(isTouch ? 'TIK TWEE KEER OM TE SCHIETEN' : 'DRUK TWEE KEER OP SPATIE OM TE SCHIETEN', 74, '#fcfcfc');
  if ((T * 2 | 0) % 2 === 0) ctext(isTouch ? 'TIK OM TE STARTEN' : 'DRUK OP ENTER OF SPATIE', 84, '#fcd800');
  rect(0, 171, W, 9, 'rgba(0,0,0,0.7)');
  const ctl = '5 PENALTY\'S - SCOOR ZOVEEL MOGELIJK!'; stext(ctl, Math.round((W - tw(ctl)) / 2), 173, '#d8d8d8');
  rect(WBTN[0] - 1, WBTN[1] - 1, WBTN[2] + 2, WBTN[3] + 2, '#404070'); rect(WBTN[0], WBTN[1], WBTN[2], WBTN[3], '#101030'); stext('WEDSTRIJD', Math.round(WBTN[0] + (WBTN[2] - tw('WEDSTRIJD')) / 2), WBTN[1] + 6, '#3cbcfc');
}
function render() {
  g.imageSmoothingEnabled = false;
  if (mode === 'title') drawTitle(); else drawGame();
}

// ---------- invoer
let isTouch = matchMedia('(pointer:coarse)').matches;
const WBTN = [8, 150, 100, 16];
function wake() { ac(); }
addEventListener('keydown', e => {
  const k = e.key;
  if ([' ', 'Enter', 'ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown'].includes(k)) e.preventDefault();
  if (e.repeat) return;
  wake(); isTouch = false;
  if (k === 'm' || k === 'M') { soundOn = !soundOn; return; }
  if (mode === 'title' && (k === 'w' || k === 'W')) { location.href = 'wedstrijd.html'; return; }
  if ([' ', 'Enter', 'ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', 'd', 'D', 'w', 'W'].includes(k)) press();
});
addEventListener('pointerdown', e => {
  e.preventDefault(); wake();
  if (e.pointerType === 'touch') isTouch = true;
  if (mode === 'title') { const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H; if (x >= WBTN[0] && x <= WBTN[0] + WBTN[2] && y >= WBTN[1] && y <= WBTN[1] + WBTN[3]) { location.href = 'wedstrijd.html'; return; } }
  press();
});
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  update(dt); render(); requestAnimationFrame(frame);
}
buildCrowd(); newRound(); mode = 'title';
requestAnimationFrame(frame);
</script>
