// ---------- sprites en poppetjes (schattig: grote hoofdjes met gezichtjes)
const BOTTLE = ['..cccc..', '..cccc..', '...cc...', '..bbbb..', '.bwbbbb.', '.bbkbkb.', '.bbbbbb.', '.bbrrbb.', '.bbbbbb.',

    if (isFull()) { exit.call(d); return; }
    const p = req.call(el), lock = () => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) { /* niet beschikbaar */ } };

addEventListener('pointerup', swipeEnd); addEventListener('pointercancel', swipeEnd);

function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;

}
requestAnimationFrame(frame);
